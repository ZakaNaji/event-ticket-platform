spring.application.name=event-ticket-platform

##compose:
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start_only
spring.docker.compose.file=compose.yml

##jpa:
spring.datasource.url=jdbc:postgresql://localhost:5432/eventplatform
spring.datasource.username=eventuser
spring.datasource.password=eventpass
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update